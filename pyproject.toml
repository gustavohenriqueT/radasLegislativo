[project]
name = "radar-legislativo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx", "psycopg[binary]"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]